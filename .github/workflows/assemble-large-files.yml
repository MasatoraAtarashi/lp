name: Assemble large files

on:
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml.part-*"
      - "worker-configuration.d.ts.part-*"
      - ".github/workflows/assemble-large-files.yml"

permissions:
  contents: write

concurrency:
  group: assemble-large-files
  cancel-in-progress: false

jobs:
  assemble:
    name: Restore split source files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      - name: Concatenate exact byte parts
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import pathlib
          root = pathlib.Path(".")
          for name in ("pnpm-lock.yaml", "worker-configuration.d.ts"):
              parts = sorted(root.glob(name + ".part-*"))
              if not parts:
                  continue
              data = b"".join(p.read_bytes() for p in parts)
              (root / name).write_bytes(data)
              for p in parts:
                  p.unlink()
          wf = root / ".github/workflows/assemble-large-files.yml"
          if wf.exists():
              wf.unlink()
          PY

      - name: Commit restored files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "feat: Everyday Japan inbound tour LP from public-lp"
          git push
